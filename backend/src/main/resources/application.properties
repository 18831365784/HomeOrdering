# 服务器配置
server.port=8080
server.servlet.context-path=/api
# 小程序/浏览器访问后端的根地址（不要带 /api）。换电脑或穿透只改这一行
server.url=${SERVER_URL:http://localhost:8080}

# 数据源（换库只改这里或对应环境变量）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/home_ordering?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# MyBatis-Plus
mybatis-plus.type-aliases-package=com.homeordering.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 文件上传
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.path=${FILE_UPLOAD_PATH:./uploads/}
file.upload.type=local

# 微信小程序（必须用环境变量提供，不要把真实密钥写进仓库）
wx.appid=${WX_APPID:wxe17c8a6b5b7ff823}
wx.secret=${WX_SECRET:7cda5e74ad68a823dd29aae7e2d1a229}

logging.level.com.homeordering=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n