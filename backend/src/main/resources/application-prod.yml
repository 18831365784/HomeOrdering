# 服务器生产环境。启动：java -jar xxx.jar --spring.profiles.active=prod
#
# server.url 用于拼接上传图绝对地址（不要带 /api）。备案 + HTTPS 后默认走域名；
# 临时回退公网 IP 时设环境变量 SERVER_URL=http://82.157.3.231:8080

server:
  url: ${SERVER_URL:https://selfcode.top}

spring:
  datasource:
    # 后端与 MySQL 同机，走回环地址
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/home_ordering?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}"
    username: ${DB_USERNAME:admin}
    password: "${DB_PASSWORD:Ljf010711!}"

# 上传目录：相对路径相对「java -jar 启动时所在目录」；生产可改绝对路径或环境变量 FILE_UPLOAD_PATH
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads/}

logging:
  level:
    root: INFO
    com.homeordering: INFO
